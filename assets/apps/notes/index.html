<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11151a"><title>Notes / NUCALORIC</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#11151a;color:#eaf1fa}*{box-sizing:border-box}body{margin:0;padding:40px 20px}main{max-width:900px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #ffffff22;padding-bottom:25px;margin-bottom:30px}.brand{letter-spacing:.15em;font-size:10px;color:#adcffa}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.055em;font-weight:500;margin:12px 0}p{color:#97a9be;font-size:13px;line-height:1.8}button,input,select,textarea{font:inherit}button,.button{padding:11px 16px;border:1px solid #ffffff27;background:#ffffff07;border-radius:6px;color:#d9eaff;cursor:pointer;text-decoration:none;font-size:12px}button:hover{background:#ffffff12}button.primary{background:#c2ddff;color:#131e2b}textarea,input,select{width:100%;padding:12px;background:#ffffff03;border:1px solid #ffffff26;border-radius:5px;color:#eaf2fc;font-size:14px}textarea{min-height:330px;resize:vertical;line-height:1.7}label{display:block;font-size:11px;color:#9cafc7;margin-bottom:8px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.status{font-size:11px;min-height:18px;color:#f6bfd9}.meta{font-size:10px;margin-top:30px;border-top:1px solid #ffffff16;padding-top:15px}.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.column{background:#ffffff03;padding:15px;border:1px solid #ffffff1c;border-radius:6px}.column h2{font-size:13px;font-weight:500;color:#bddbff;margin:0 0 17px}.task{padding:12px;margin:9px 0;background:#ffffff06;border:1px solid #ffffff1a;border-radius:4px}.task p{color:#dce8f5;margin:0 0 10px;overflow-wrap:anywhere;font-size:12px}.task button{padding:6px;font-size:10px;margin-right:5px}.entry{display:flex;gap:10px}.entry input{flex:1}.grid-canvas{display:grid;grid-template-columns:repeat(16,1fr);max-width:480px;touch-action:none;border:1px solid #ffffff33;background:#0b0d11;gap:1px}.grid-canvas button{border:0;border-radius:0;aspect-ratio:1;padding:0;min-width:0;background:#15191f}.colors{display:flex;gap:7px}.colors button{width:30px;height:30px;padding:0;border:2px solid transparent}.colors button[aria-pressed=true]{border-color:#fff}.json-area{font-family:ui-monospace,monospace;font-size:12px}@media(max-width:600px){body{padding:25px 16px}.columns{grid-template-columns:1fr}header{display:block}}
</style></head><body><main><header><div><span class="brand">NUCALORIC / YOUR SERVER APPS</span><h1>Notes</h1><p>A quiet place to put an idea.</p></div><span class="brand">01 / SMALL &amp; USEFUL</span></header><label for="note">Your note</label><textarea id="note" placeholder="Start with a thought…"></textarea><div class="toolbar"><button id="export" class="primary">Export note ↗</button><label class="button">Import text<input id="import" type="file" accept=".txt,.md,text/plain" hidden></label></div><p id="notice" class="status" role="status" aria-live="polite"></p><p class="meta">This app is served by your website server. Edits stay in this browser; export a copy to keep them elsewhere. App files are public. No account secrets belong here.</p></main><script>
const key='nuc-app:'+location.pathname;const notice=document.getElementById('notice');function say(text){notice.textContent=text}function read(fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{say('Saved data could not be read. It has been kept. Export your work before closing.');return fallback}}function save(value){try{localStorage.setItem(key,JSON.stringify(value));say('Saved in this browser.')}catch{say('Browser storage is full or unavailable. Export your work to keep it.')}}function download(value,name,type='text/plain'){const url=URL.createObjectURL(new Blob([value],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const note=document.getElementById('note');const stored=read('');note.value=typeof stored==='string'?stored:'';note.addEventListener('input',()=>save(note.value));document.getElementById('export').onclick=()=>download(note.value,'nucaloric-note.txt');document.getElementById('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>500000){say('Choose a text file under 500 KB.');return}note.value=await f.text();save(note.value)};
</script></body></html>
